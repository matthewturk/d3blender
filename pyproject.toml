[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d3blender"
version = "0.1.0"
description = "A d3.js-flavored selector, join/reconciliation, and animation layer over Blender's scene graph."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
blender-test = [
    # PyPI's headless "bpy" module -- real Blender, no application install
    # needed, but only ships cp313 wheels, so this extra needs its own
    # Python 3.13 venv (the main dev venv can stay on whatever version it
    # likes). Pinned to an exact version, not a range: bpy publishes one
    # wheel set per Blender release, and this project targets 5.3+ while
    # the newest wheel on PyPI as of writing is 5.2.0 -- same
    # newest-available-isn't-quite-current-target gap as nodebpy (see
    # CLAUDE.md). Bump the pin, don't loosen it, once a 5.3 wheel exists.
    "bpy==5.2.0; python_version == '3.13'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# tests/ and tests/blender/ deliberately share some test-module basenames
# (test_points.py, test_point_attrs.py, test_join_creator.py: mock vs.
# real-bpy versions of the same feature) and neither directory is a
# package. The default "prepend" import mode then refuses a whole-repo run
# ("import file mismatch"); importlib mode imports each file by its path,
# so `pytest` from either venv collects both directories.
addopts = "--import-mode=importlib"
markers = [
    "blender: exercises real bpy (tests/blender/) -- needs the blender-test extra; auto-skipped otherwise, see tests/blender/README.md",
]
